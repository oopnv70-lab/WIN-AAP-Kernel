name: Capture Patched Source (AAP-AN00)

# ============================================================================
# 目的：只做「拉源码 -> 荣耀覆盖 -> 打补丁(KSU/SUSFS/BBG) -> 停」，不编译。
#      把「打完补丁之后的源码」打成 artifact 供下载核对。
#
# 为什么需要它：现有 build-gki.yml 只看得到编译日志和最终 Image，
#      从没把「补丁后的源码」保存下来。编译能过 != 补丁打对；
#      符号在 != 逻辑对。本工作流专门补这个盲点。
#
# 注意：KPM 不在源码里（它是编译后对 Image 做 kpimg 二进制注入），
#      本工作流采不到 KPM 的痕迹，属正常。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      sukisu_ref:
        description: 'SukiSU-Nova 分支/tag/commit（默认锁 builtin-new @ 5a3ec414）'
        required: false
        default: '5a3ec4145059ed2c4f22c70a16a28a616e104c33'
        type: string
      builtin_manager:
        description: '内置管理器（与 build 保持一致，选不内置则不注入 KSU/SUSFS）'
        required: false
        default: '内置管理器'
        type: choice
        options:
          - '内置管理器'
          - '不内置'
      enable_susfs:
        description: 'SUSFS'
        required: false
        default: '启用 SUSFS'
        type: choice
        options:
          - '启用 SUSFS'
          - '不启用'
      enable_kpm:
        description: 'KPM（仅影响 ksu.fragment 里的 CONFIG_KPM=y，源码层无 KPM 实体）'
        required: false
        default: '启用 KPM'
        type: choice
        options:
          - '启用 KPM'
          - '不启用'
      enable_bbg:
        description: 'BBG 防格机 (Baseband-guard LSM)'
        required: false
        default: '启用 BBG'
        type: choice
        options:
          - '启用 BBG'
          - '不启用'

# 独立并发组，绝不与 gki-build 冲突；同一时刻只跑一个采集
concurrency:
  group: capture-source
  cancel-in-progress: false

env:
  MODEL: AAP-AN00
  BRANCH: common-android16-6.12
  KERNEL_PLATFORM: ${{ github.workspace }}/kp

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 拉取配方仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装依赖
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip unzip curl rsync \
            python3 python3-pip lz4 device-tree-compiler file libarchive-tools \
            libxml2-utils aria2

      - name: 安装 repo 同步工具
        run: |
          set -euxo pipefail
          mkdir -p ~/bin
          curl -fsSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 拉取荣耀开源代码 (动态查询有效链接)
        run: |
          set -euxo pipefail
          chmod +x scripts/fetch_honor_source.sh
          ./scripts/fetch_honor_source.sh "${MODEL}" "${GITHUB_WORKSPACE}/honor_src"
          du -sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" || true

      - name: 同步 AOSP 内核基础工程
        run: |
          set -euxo pipefail
          mkdir -p "$KERNEL_PLATFORM" && cd "$KERNEL_PLATFORM"
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH" --depth=1 --no-repo-verify
          repo sync -c --no-tags --optimized-fetch -j12 --force-sync || { echo "::error::repo sync 失败"; exit 1; }
          du -sh "$KERNEL_PLATFORM" || true
          df -h /

      - name: 覆盖荣耀内核源码（与 build 完全一致）
        run: |
          set -euxo pipefail
          SRC="${GITHUB_WORKSPACE}/honor_src/Code_Opensource"
          test -d "${SRC}/kernel" || { echo "::error::找不到荣耀 kernel 目录"; exit 1; }
          rsync -a --delete --exclude='.git' "${SRC}/kernel/" "${KERNEL_PLATFORM}/common/"
          echo "=== 覆盖后内核版本 ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' "${KERNEL_PLATFORM}/common/Makefile"
          for f in \
            BUILD.bazel \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/ogki.fragment \
            gki/aarch64/abi.stg \
            gki/aarch64/symbols/base \
            gki/aarch64/symbols/honor \
            gki/aarch64/symbols/qcom ; do
            test -f "${KERNEL_PLATFORM}/common/$f" \
              || { echo "::error::荣耀覆盖后缺关键文件 $f"; exit 1; }
          done
          echo "✓ 荣耀定制关键文件全部在位"

      - name: 冻结「荣耀基线」快照（用于把厂商源码与我们的补丁分离）
        run: |
          set -euxo pipefail
          C="$KERNEL_PLATFORM/common"
          cd "$C"
          # 覆盖荣耀源码后，common 相对 AOSP HEAD 是海量改动；先整体提交成「荣耀基线」，
          # 后面集成脚本的改动相对它做 diff，就能精准隔离出「我们补丁改了什么」。
          git add -A -- ':!*/.git' || git add -A
          git commit -q -m "HONOR_BASELINE_SNAPSHOT $(date -u +%FT%TZ)" --no-verify || \
            echo "::warning::基线提交失败（可能本就干净），继续"
          BASE_SHA=$(git rev-parse HEAD)
          echo "BASE_SHA=$BASE_SHA" | tee "$GITHUB_WORKSPACE/baseline-sha.txt"
          # 厂商覆盖量（相对 AOSP 上游）只留统计，避免 diff 爆炸
          git diff --stat HEAD^ HEAD > "$GITHUB_WORKSPACE/honor-vs-aosp.stat.txt" 2>/dev/null || true
          echo "--- 荣耀覆盖统计（前 15 行）---"
          head -15 "$GITHUB_WORKSPACE/honor-vs-aosp.stat.txt" || true

      - name: 集成 Baseband-guard (防格机 LSM)
        if: ${{ inputs.enable_bbg == '启用 BBG' }}
        env:
          BBG_REF: 48d9fdea643bcb41d204541400e9d8656b97a54f
        run: |
          set -euxo pipefail
          chmod +x scripts/integrate_bbg.sh
          ./scripts/integrate_bbg.sh "${KERNEL_PLATFORM}" "${BBG_REF}" 2>&1 | tee "$GITHUB_WORKSPACE/log-bbg.txt"

      - name: 集成 SukiSU-Nova (内置 CONFIG_KSU=y)
        if: ${{ inputs.builtin_manager == '内置管理器' }}
        env:
          SUKISU_REF: ${{ inputs.sukisu_ref || '5a3ec4145059ed2c4f22c70a16a28a616e104c33' }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs == '启用 SUSFS' && 'true' || 'false' }}
          ENABLE_KPM: ${{ inputs.enable_kpm == '启用 KPM' && 'true' || 'false' }}
        run: |
          set -euxo pipefail
          echo "SukiSU ref = ${SUKISU_REF}"
          chmod +x scripts/integrate_sukisu.sh
          ./scripts/integrate_sukisu.sh "${KERNEL_PLATFORM}" "${SUKISU_REF}" 2>&1 | tee "$GITHUB_WORKSPACE/log-sukisu.txt"

      - name: 集成 SUSFS (susfs4ksu gki-android16-6.12)
        if: ${{ inputs.builtin_manager == '内置管理器' && inputs.enable_susfs == '启用 SUSFS' }}
        env:
          SUSFS_REF: 9b0b13f069673b9b07b713a5c66977de4d62b175
        run: |
          set -euxo pipefail
          chmod +x scripts/integrate_susfs.sh scripts/shim_susfs_task_mmu.py scripts/check_susfs_symbols.py
          ./scripts/integrate_susfs.sh "${KERNEL_PLATFORM}" "${SUSFS_REF}" 2>&1 | tee "$GITHUB_WORKSPACE/log-susfs.txt"

      - name: 采集「补丁后源码」差异（相对荣耀基线）
        if: always()
        run: |
          set -uo pipefail
          C="$KERNEL_PLATFORM/common"
          BASE_SHA=$(sed -n 's/^BASE_SHA=//p' "$GITHUB_WORKSPACE/baseline-sha.txt" 2>/dev/null)
          OUT="$GITHUB_WORKSPACE/patched-source"
          rm -rf "$OUT"; mkdir -p "$OUT"
          {
            echo "# 采集元信息"
            echo "run=$GITHUB_RUN_NUMBER  sha=$GITHUB_SHA"
            echo "BASE_SHA(荣耀基线)=$BASE_SHA"
            echo "输入: builtin_manager=${{ inputs.builtin_manager }} enable_susfs=${{ inputs.enable_susfs }} enable_kpm=${{ inputs.enable_kpm }} enable_bbg=${{ inputs.enable_bbg }}"
            echo "sukisu_ref=${{ inputs.sukisu_ref }}"
            echo "注意: KPM 为编译后二进制注入，本包不含其源码痕迹（正常）"
          } > "$OUT/META.txt"

          if [ -d "$C/.git" ] && [ -n "$BASE_SHA" ]; then
            cd "$C"
            # 把集成脚本新增/修改全部纳入（含新文件）；嵌套 .git 会以 gitlink 形式出现，属预期
            git add -A -- ':!*/.git' 2>/dev/null || git add -A 2>/dev/null || true
            echo "===== git status (相对荣耀基线) ====="; git status --porcelain | tee "$OUT/status.txt"
            git diff --cached --stat "$BASE_SHA" > "$OUT/integration.stat.txt" 2>&1 || true
            git diff --cached --binary "$BASE_SHA" > "$OUT/integration.diff" 2>&1 || true
            git ls-files --others --exclude-standard > "$OUT/untracked-files.txt" 2>&1 || true
            echo "===== 集成补丁统计 ====="; cat "$OUT/integration.stat.txt"
          else
            echo "::error::common 非 git 仓库或 BASESHA 缺失，退化抓取"
            ( cd "$C" && find . -type f -newermt '-30 minutes' 2>/dev/null | head -500 ) > "$OUT/recent-files.txt" || true
          fi

          # 收拢片段/补丁文件（fragment、.patch、.diff），便于核对
          mkdir -p "$OUT/fragments" "$OUT/patches"
          find "$KERNEL_PLATFORM" -maxdepth 6 -name '*.fragment' -type f 2>/dev/null -exec cp -v {} "$OUT/fragments/" \; | sed 's/^/  frag: /' || true
          find "$KERNEL_PLATFORM" -maxdepth 6 \( -name '*.patch' -o -name '*.diff' \) -type f 2>/dev/null -exec cp -v {} "$OUT/patches/" \; | sed 's/^/  patch: /' || true

          # 单独把「被改动的源文件」打包（diff 之外的实体文件，便于直接看源码）
          if [ -d "$C/.git" ] && [ -n "$BASE_SHA" ]; then
            cd "$C"
            { git diff --cached --name-only "$BASE_SHA"; git ls-files --others --exclude-standard; } \
              | sort -u | grep -vE '/\.git/' > "$OUT/changed-files.txt" || true
            tar -czf "$OUT/changed-files.tar.gz" -T "$OUT/changed-files.txt" 2>/dev/null || \
              echo "::warning::打包 changed-files 失败（不影响 diff 主体）"
          fi

          cp "$GITHUB_WORKSPACE"/honor-vs-aosp.stat.txt "$OUT/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/log-*.txt "$OUT/" 2>/dev/null || true

          ( cd "$GITHUB_WORKSPACE" && tar -czf "patched-source-r${GITHUB_RUN_NUMBER}.tar.gz" patched-source 2>/dev/null ) || true
          echo "===== 产物清单 ====="; ls -la "$OUT"; echo; ls -la "$GITHUB_WORKSPACE"/patched-source-r*.tar.gz 2>/dev/null || true
          echo "===== 关键文件大小（确认 diff 非空）====="
          wc -c "$OUT/integration.diff" "$OUT/status.txt" 2>/dev/null || true

      - name: 上传「补丁后源码」包
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-source-r${{ github.run_number }}
          path: |
            patched-source-r${{ github.run_number }}.tar.gz
            patched-source/**
          if-no-files-found: warn
          retention-days: 30