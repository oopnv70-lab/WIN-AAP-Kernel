name: Build GKI (AAP-AN00)

on:
  workflow_dispatch:

concurrency:
  group: gki-build
  cancel-in-progress: false

env:
  MODEL: AAP-AN00
  BRANCH: common-android16-6.12
  KERNEL_PLATFORM: ${{ github.workspace }}/kp

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 拉取配方仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip unzip curl zlib1g-dev \
            libc6-dev libncurses-dev libssl-dev libelf-dev bc cpio rsync \
            python3 python3-pip dwarves lz4 device-tree-compiler ccache \
            file libarchive-tools libxml2-utils aria2

      - name: 安装 repo 同步工具
        run: |
          set -euxo pipefail
          mkdir -p ~/bin
          curl -fsSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 拉取荣耀开源代码 (动态查询有效链接)
        run: |
          set -euxo pipefail
          chmod +x scripts/fetch_honor_source.sh
          ./scripts/fetch_honor_source.sh "${MODEL}" "${GITHUB_WORKSPACE}/honor_src"
          du -sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" || true

      - name: 同步 AOSP 内核基础工程
        run: |
          set -euxo pipefail
          mkdir -p "$KERNEL_PLATFORM" && cd "$KERNEL_PLATFORM"
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH" --depth=1 --no-repo-verify
          # 采样：判断 repo sync 瓶颈是 CPU 打满还是并发不足
          (
            while :; do
              C=$(awk '/^cpu /{u=$2+$4;t=$2+$4+$5;if(t>0)printf "%.0f", u*100/t}' /proc/stat)
              L=$(cut -d" " -f1-3 /proc/loadavg)
              echo "t=${SECONDS}s cpu=${C}% load=[${L}]"
              sleep 5
            done
          ) > "$GITHUB_WORKSPACE/sync-monitor.log" 2>&1 &
          MON=$!
          T0=$(date +%s)
          repo sync -c --no-tags --optimized-fetch -j12 --force-sync || { kill $MON 2>/dev/null || true; echo "::error::repo sync 失败"; exit 1; }
          T1=$(date +%s)
          kill $MON 2>/dev/null || true
          wait $MON 2>/dev/null || true
          echo "=== repo sync 耗时 $((T1-T0))s ==="
          echo "--- 采样尾部 ---"
          tail -20 "$GITHUB_WORKSPACE/sync-monitor.log"

      - name: 覆盖荣耀内核源码
        run: |
          set -euxo pipefail
          SRC="${GITHUB_WORKSPACE}/honor_src/Code_Opensource"
          test -d "${SRC}/kernel" || { echo "::error::找不到荣耀 kernel 目录"; exit 1; }
          rsync -a --delete --exclude='.git' "${SRC}/kernel/" "${KERNEL_PLATFORM}/common/"
          echo "=== 覆盖后内核版本 ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' "${KERNEL_PLATFORM}/common/Makefile"

      - name: 集成 SukiSU-Nova (main 分支, CONFIG_KSU=y 内置)
        run: |
          set -euxo pipefail
          chmod +x scripts/integrate_sukisu.sh
          ./scripts/integrate_sukisu.sh "${KERNEL_PLATFORM}"

      - name: 编译 GKI 内核 (kleaf, 只编需要的 target)
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          LOG="$GITHUB_WORKSPACE/build.log"
          ls -l tools/bazel || { echo "::error::缺少 tools/bazel"; exit 1; }
          T0=$(date +%s)
          # 三个 target：kernel_aarch64 -> Image; gki_artifacts -> boot.img; images -> system_dlkm
          tools/bazel build --config=fast \
            //common:kernel_aarch64 \
            //common:kernel_aarch64_gki_artifacts \
            //common:kernel_aarch64_images >>"$LOG" 2>&1 || {
            echo "::error::GKI 编译失败"
            grep -inE 'error|FAILED|fatal|Exception' "$LOG" | head -40
            tail -60 "$LOG"
            exit 1; }
          T1=$(date +%s); echo "编译耗时 $((T1-T0))s"
          tail -15 "$LOG"

      - name: 取出产物 (Image / boot.img / system_dlkm)
        run: |
          set -uo pipefail
          cd "$KERNEL_PLATFORM"
          D="$GITHUB_WORKSPACE/dist"; mkdir -p "$D"
          EXEC=$(tools/bazel info execution_root 2>/dev/null)
          echo "execroot=$EXEC"
          FILES=$(tools/bazel cquery --output=files \
            //common:kernel_aarch64 \
            //common:kernel_aarch64_gki_artifacts \
            //common:kernel_aarch64_images 2>/dev/null || true)
          echo '==== cquery 产物 ===='
          printf '%s\n' "$FILES" | head -40
          take() {
            n="$1"; src=""
            p=$(printf '%s\n' "$FILES" | grep -E "(^|/)$n\$" | head -1)
            if [ -n "$p" ]; then
              if [ -f "$p" ]; then src="$p"; else src="$EXEC/$p"; fi
            fi
            if [ ! -f "$src" ]; then
              src=$(find "$EXEC" -maxdepth 9 -type f -name "$n" -path '*kernel_aarch64*' 2>/dev/null | head -1)
            fi
            if [ -n "$src" ] && [ -f "$src" ]; then cp -v "$src" "$D/$n"; return 0; fi
            return 1
          }
          rc=0
          take Image || { echo "::error::没有产出 Image（AnyKernel3 必须有它）"; rc=1; }
          take boot.img || echo "::warning::没有 boot.img（仅备用）"
          take system_dlkm.ext4.img || echo "::warning::没有 system_dlkm.ext4.img"
          take system_dlkm.erofs.img || echo "::warning::没有 system_dlkm.erofs.img"
          [ "$rc" -eq 0 ] || exit 1
          # Image 头 magic 校验（aarch64 内核 magic 0x644d5241 @ 0x38）
          MAGIC=$(od -An -tx4 -j 56 -N 4 "$D/Image" 2>/dev/null | tr -d ' \n')
          echo "Image magic@0x38 = $MAGIC"
          [ "$MAGIC" = "644d5241" ] || { echo "::error::Image 头 magic 不是 644d5241，产物不对"; exit 1; }
          strings -a "$D/Image" 2>/dev/null | grep -m1 '^Linux version' || echo "::warning::Image 里没找到 Linux version 串"
          ls -la "$D"

      - name: 打包 AnyKernel3 刷机包
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          D="$GITHUB_WORKSPACE/dist"
          test -f "$D/Image" || { echo "::error::dist/Image 不存在，无法打包"; exit 1; }
          rm -rf ak3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3 || {
            echo "::error::克隆 AnyKernel3 失败"; exit 1; }
          cd ak3
          rm -rf .git .github patch ramdisk modules
          test -f META-INF/com/google/android/update-binary || { echo "::error::AK3 模板缺 update-binary"; exit 1; }
          test -f tools/ak3-core.sh || { echo "::error::AK3 模板缺 tools/ak3-core.sh"; exit 1; }
          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ### AAP-AN00 (HONOR WIN) - 自编译纯 GKI (android16-6.12 / 6.12.58)
          ### 本机形态：A/B 槽；boot.img 为 header v4 且无 ramdisk（ramdisk 在 init_boot）。
          ### 因此只做「拆 boot -> 换内核 -> 回写」，不碰 ramdisk、不碰 init_boot、不碰 recovery。
          properties() { '
          kernel.string=AAP-AN00 GKI 6.12.58 (self-built)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=AAP-AN00
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties
          SLOT_SELECT=active;
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          case "$SLOT" in
            _a|_b) : ;;
            *) abort "活动槽异常（SLOT='$SLOT'），拒绝刷写。";;
          esac
          [ -n "$BLOCK" ] || abort "未能确定目标分区，拒绝刷写。"
          ui_print "  活动槽：$SLOT"
          ui_print "  目标分区：$BLOCK"
          split_boot;
          flash_boot;
          AK3

          cp "$D/Image" ./Image
          chmod +x tools/* 2>/dev/null || true
          cp -v "$GITHUB_WORKSPACE/LICENSE" ./LICENSE 2>/dev/null || true
          cp -v "$GITHUB_WORKSPACE/NOTICE.md" ./NOTICE.md 2>/dev/null || true
          mkdir -p ./LICENSES
          cp -v "$GITHUB_WORKSPACE"/LICENSES/*.txt ./LICENSES/ 2>/dev/null || true
          echo '==== 包内根目录 ===='
          ls -l anykernel.sh Image
          bash -n anykernel.sh || { echo "::error::anykernel.sh 语法错误"; exit 1; }
          for chk in 'SLOT_SELECT=active;' 'BLOCK=boot;' 'IS_SLOT_DEVICE=1;' 'PATCH_VBMETA_FLAG=auto;'; do
            grep -qF "$chk" anykernel.sh || { echo "::error::anykernel.sh 缺约束：$chk"; exit 1; }
          done
          grep -qF 'split_boot;' anykernel.sh && grep -qF 'flash_boot;' anykernel.sh \
            || { echo "::error::anykernel.sh 缺 split_boot/flash_boot"; exit 1; }
          ZIP="$D/AAP-AN00-GKI-AnyKernel3-$GITHUB_RUN_NUMBER.zip"
          rm -f "$ZIP"
          zip -r9 "$ZIP" . -x '*.git*' >/dev/null || { echo "::error::zip 失败"; exit 1; }
          echo '==== zip 目录结构 ===='
          unzip -l "$ZIP" | head -30
          unzip -l "$ZIP" | grep -q 'anykernel.sh' || { echo "::error::zip 缺 anykernel.sh"; exit 1; }
          unzip -l "$ZIP" | grep -q 'META-INF/com/google/android/update-binary' || { echo "::error::zip 缺 update-binary"; exit 1; }
          unzip -l "$ZIP" | grep -q 'tools/ak3-core.sh' || { echo "::error::zip 缺 tools/ak3-core.sh"; exit 1; }
          unzip -l "$ZIP" | grep -qE ' Image$' || { echo "::error::zip 缺 Image"; exit 1; }
          ls -lh "$ZIP"

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: AAP-AN00-GKI-AnyKernel3
          path: |
            dist/*.zip
            dist/system_dlkm.ext4.img
            dist/system_dlkm.erofs.img
          if-no-files-found: warn
