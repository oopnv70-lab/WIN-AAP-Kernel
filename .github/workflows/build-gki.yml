name: Build GKI (AAP-AN00)

on:
  workflow_dispatch:

concurrency:
  group: gki-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取配方仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          set -x
          df -h / /mnt 2>/dev/null || df -h
          echo "=== 清理前磁盘 ==="
          # 删除 runner 预装的大目录，腾出空间
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /usr/local/share/powershell \
                      /usr/local/share/chromium \
                      /usr/local/lib/node_modules \
                      /opt/ghc \
                      /opt/hostedtoolcache \
                      /usr/local/.ghcup \
                      /usr/share/swift 2>/dev/null || true
          # 清理 apt 缓存
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          echo "=== 清理后磁盘 ==="
          df -h / /mnt 2>/dev/null || df -h

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git repo aria2 curl python3 python3-pip \
            build-essential bison flex bc libssl-dev libelf-dev \
            dwarves cpio lz4 rsync zip unzip \
            kmod python3-setuptools python3-venv
          pip3 install --user abigail-tools 2>/dev/null || true

      - name: 拉取并解压荣耀源码
        run: |
          set -x
          chmod +x scripts/fetch_honor_source.sh
          ./scripts/fetch_honor_source.sh "AAP-AN00" "${GITHUB_WORKSPACE}/honor_src"
          du -sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" || true
          echo "=== kernel version ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' "${GITHUB_WORKSPACE}/honor_src/Code_Opensource/kernel/Makefile"

      - name: 拉取 Google ack 源码
        run: |
          set -x
          mkdir -p ack && cd ack
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android16-6.12 --depth=1
          repo sync -c -j$(nproc)

      - name: 覆盖荣耀内核源码
        run: |
          set -x
          rsync -a --delete "${GITHUB_WORKSPACE}/honor_src/Code_Opensource/kernel/" ack/common/
          echo "=== after overlay ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' ack/common/Makefile
          ls ack/common/

      - name: 构建 GKI 内核
        run: |
          set -x
          cd ack
          tools/bazel run //common:kernel_aarch64_abi_dist --config=release

      - name: 收集构建产物
        run: |
          set -x
          mkdir -p dist
          find ack -path '*kernel_aarch64*' \( -name 'Image' -o -name 'Image.gz' -o -name '*.img' \) -exec cp -v {} dist/ \; 2>/dev/null || true
          find ack -name 'kernel_aarch64_gki_artifacts' -type d 2>/dev/null | while read d; do
            cp -rv "$d" dist/ 2>/dev/null || true
          done
          ls -laR dist/ | head -100

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: AAP-AN00-GKI-artifacts
          path: dist/
          if-no-files-found: warn
