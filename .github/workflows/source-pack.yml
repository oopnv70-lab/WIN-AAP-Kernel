name: Pack Patched Source (AAP-AN00)

on:
  workflow_dispatch:
    inputs:
      sukisu_ref:
        description: 'SukiSU-Nova 分支/tag/commit（默认锁 builtin-new @ 5a3ec414；builtin 在 6.12 上 LSM API 编译失败，main 无 SUSFS 符号）'
        required: false
        default: '5a3ec4145059ed2c4f22c70a16a28a616e104c33'
        type: string
      builtin_manager:
        description: '内置管理器'
        required: false
        default: '内置管理器'
        type: choice
        options:
          - '内置管理器'
          - '不内置'
      enable_susfs:
        description: 'SUSFS'
        required: false
        default: '启用 SUSFS'
        type: choice
        options:
          - '启用 SUSFS'
          - '不启用'
      enable_kpm:
        description: 'KPM (KernelPatch 后加机制)'
        required: false
        default: '启用 KPM'
        type: choice
        options:
          - '启用 KPM'
          - '不启用'
      enable_bbg:
        description: 'BBG 防格机 (Baseband-guard LSM)'
        required: false
        default: '启用 BBG'
        type: choice
        options:
          - '启用 BBG'
          - '不启用'
      superkey:
        description: 'KernelPatch superkey（KPM 解锁密钥；留空则随机生成并打印到构建摘要）'
        required: false
        default: ''
        type: string
concurrency:
  group: pack-source
  cancel-in-progress: false

env:
  MODEL: AAP-AN00
  BRANCH: common-android16-6.12
  KERNEL_PLATFORM: ${{ github.workspace }}/kp

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 拉取配方仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: 安装依赖（仅源码准备所需，不装编译器）
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core curl unzip rsync python3 aria2 patch xz-utils file

      - name: 拉取荣耀开源代码 (动态查询有效链接)
        run: |
          set -euxo pipefail
          chmod +x scripts/fetch_honor_source.sh
          ./scripts/fetch_honor_source.sh "${MODEL}" "${GITHUB_WORKSPACE}/honor_src"
          du -sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" || true

      - name: 盘点荣耀源码许可证（合规留痕）
        run: |
          set -uo pipefail
          chmod +x scripts/audit_licenses.sh
          ./scripts/audit_licenses.sh "${GITHUB_WORKSPACE}/honor_src/Code_Opensource" | tee "${GITHUB_WORKSPACE}/license-audit.log"

      - name: 覆盖荣耀内核源码
        run: |
          set -euxo pipefail
          SRC="${GITHUB_WORKSPACE}/honor_src/Code_Opensource"
          test -d "${SRC}/kernel" || { echo "::error::找不到荣耀 kernel 目录"; exit 1; }
          mkdir -p "${KERNEL_PLATFORM}/common"
          rsync -a --delete --exclude='.git' "${SRC}/kernel/" "${KERNEL_PLATFORM}/common/"
          echo "=== 覆盖后内核版本 ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' "${KERNEL_PLATFORM}/common/Makefile"
          echo "=== 荣耀定制关键文件存在性校验（防止开源包不完整被 --delete 静默删掉）==="
          for f in \
            BUILD.bazel \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/ogki.fragment \
            gki/aarch64/abi.stg \
            gki/aarch64/symbols/base \
            gki/aarch64/symbols/honor \
            gki/aarch64/symbols/qcom ; do
            test -f "${KERNEL_PLATFORM}/common/$f" \
              || { echo "::error::荣耀覆盖后缺关键文件 $f（开源包可能不完整，rsync --delete 误删）"; exit 1; }
          done
          echo "✓ 荣耀定制关键文件全部在位"

      - name: 集成 Baseband-guard (防格机 LSM)
        if: ${{ inputs.enable_bbg == '启用 BBG' }}
        env:
          BBG_REF: 48d9fdea643bcb41d204541400e9d8656b97a54f
        run: |
          set -euxo pipefail
          chmod +x scripts/integrate_bbg.sh
          ./scripts/integrate_bbg.sh "${KERNEL_PLATFORM}" "${BBG_REF}"

      - name: 集成 SukiSU-Nova (内置 CONFIG_KSU=y)
        if: ${{ inputs.builtin_manager == '内置管理器' }}
        env:
          SUKISU_REF: ${{ inputs.sukisu_ref || '5a3ec4145059ed2c4f22c70a16a28a616e104c33' }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs == '启用 SUSFS' && 'true' || 'false' }}
          ENABLE_KPM: ${{ inputs.enable_kpm == '启用 KPM' && 'true' || 'false' }}
        run: |
          set -euxo pipefail
          echo "SukiSU ref = ${SUKISU_REF}"
          chmod +x scripts/integrate_sukisu.sh
          ./scripts/integrate_sukisu.sh "${KERNEL_PLATFORM}" "${SUKISU_REF}"

      - name: 集成 SUSFS (susfs4ksu gki-android16-6.12)
        if: ${{ inputs.builtin_manager == '内置管理器' && inputs.enable_susfs == '启用 SUSFS' }}
        env:
          SUSFS_REF: 9b0b13f069673b9b07b713a5c66977de4d62b175
        run: |
          set -euxo pipefail
          chmod +x scripts/integrate_susfs.sh scripts/shim_susfs_task_mmu.py scripts/check_susfs_symbols.py
          ./scripts/integrate_susfs.sh "${KERNEL_PLATFORM}" "${SUSFS_REF}"

      - name: 门禁A · 编译前校验集成结果
        if: ${{ inputs.builtin_manager == '内置管理器' }}
        run: |
          set -uo pipefail
          chmod +x scripts/check_integration.sh
          ./scripts/check_integration.sh "${KERNEL_PLATFORM}"

      - name: 打包补丁后完整源码（与真实构建编译的树一致，仅跳过编译）
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          OUT="patched-source-${MODEL}-r${GITHUB_RUN_NUMBER}.tar.gz"
          # 只排除 .git/.repo 版本库元数据（体积大头），全部源码文件保留
          tar --exclude='.git' --exclude='.repo' -czf "$OUT" kp
          ls -lh "$OUT"
          echo '=== 抽查：common/Makefile 是否在包里 ==='
          tar -tzf "$OUT" | grep -m3 '^kp/common/Makefile$' || true

      - name: 上传补丁后源码
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-source-r${{ github.run_number }}
          path: patched-source-*.tar.gz
          if-no-files-found: warn
          retention-days: 14
